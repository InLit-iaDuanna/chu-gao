<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f2e8">
  <title>鹈鹕的海边骑行</title>
  <style>
    :root { color-scheme: light; --ink: #274b49; --paper: #f6f2e8; --accent: #e87f51; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input { font: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .page { width: min(1320px, 100%); margin: auto; padding: 30px 44px 22px; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .wordmark { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 650; letter-spacing: .12em; }
    .wordmark svg { width: 28px; height: 28px; }
    .edition { font-size: 11px; letter-spacing: .18em; color: #71857d; }
    main { margin-top: 25px; }
    .scene { position: relative; overflow: hidden; border-radius: 26px; background: #dce9dd; aspect-ratio: 1200 / 750; }
    .scene > svg { width: 100%; height: 100%; display: block; }
    .headline { position: absolute; z-index: 1; top: 7.8%; left: 6.8%; pointer-events: none; }
    .eyebrow { margin: 0 0 14px; font-size: 10px; letter-spacing: .24em; color: #567c71; }
    h1 { margin: 0; font-size: clamp(25px, 3.8vw, 49px); font-weight: 550; letter-spacing: .06em; line-height: 1.35; }
    .description { margin: 17px 0 0; font-size: clamp(10px, 1.2vw, 14px); color: #668176; letter-spacing: .05em; }
    .scene-label { position: absolute; bottom: 5%; right: 5%; font-size: 10px; letter-spacing: .16em; color: #6b8074; }
    .controls { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding: 22px 5px 10px; }
    .caption { margin: 0; color: #7b877e; font-size: 12px; letter-spacing: .04em; }
    .actions { display: flex; align-items: center; gap: 22px; }
    .speed { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #6a7f74; }
    input[type="range"] { width: 105px; height: 4px; accent-color: var(--ink); cursor: pointer; }
    output { width: 32px; font-variant-numeric: tabular-nums; }
    .pause { min-width: 118px; display: inline-flex; align-items: center; justify-content: center; gap: 9px; border: 1px solid #cbd3c8; border-radius: 30px; background: transparent; color: var(--ink); padding: 11px 17px; font-size: 12px; cursor: pointer; transition: background .2s, border-color .2s; }
    .pause:hover { background: #e7ecdf; border-color: #8ca399; }
    .pause svg { width: 13px; height: 13px; fill: currentColor; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e4a17c; outline-offset: 5px; }
    footer { display: flex; justify-content: space-between; margin-top: 20px; padding: 0 5px; font-size: 9px; color: #8c998f; letter-spacing: .14em; }
    @media (max-width: 640px) {
      .page { padding: 22px 16px; }
      .wordmark { font-size: 12px; }
      .edition { font-size: 9px; letter-spacing: .1em; }
      main { margin-top: 22px; }
      .scene { aspect-ratio: 4 / 5; border-radius: 20px; }
      .scene > svg { position: absolute; width: 165%; height: 100%; left: -35%; }
      .headline { top: 7%; left: 8%; }
      h1 { font-size: 33px; }
      .eyebrow { font-size: 8px; margin-bottom: 12px; }
      .description { font-size: 11px; margin-top: 12px; }
      .scene-label { font-size: 8px; }
      .controls { flex-wrap: wrap; gap: 17px; padding-top: 20px; }
      .caption { width: 100%; text-align: center; font-size: 11px; }
      .actions { width: 100%; justify-content: space-between; gap: 12px; }
      .speed { gap: 9px; }
      input[type="range"] { width: 88px; }
      footer { font-size: 8px; margin-top: 28px; }
    }
  </style>
</head>
<body>

        海风慢递

              <path d="M578 224q45-15 83-4" fill="none" stroke="#355a50" stroke-width="6"/>
              <path d="M592 225 607 258 633 260 650 222" fill="none" stroke="#6d8b74" stroke-width="2.5"/>

        <div class="actions">

    <footer><span>PELICAN CYCLING CLUB</span><span>慢一点，也会到达。</span></footer>
  </div>
  <script>
    (() => {
      const el = id => document.getElementById(id);
      const parts = Object.fromEntries([
        'ride', 'pelican', 'rear-spin', 'front-spin', 'crank', 'leg-front',
        'leg-front-outline', 'leg-back', 'leg-back-outline', 'foot-front',
        'foot-back', 'road', 'coast', 'cloud-one', 'cloud-two', 'cloud-three',
        'scarf-tail', 'shadow', 'breeze', 'plants'
      ].map(id => [id, el(id)]));
      const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      let playing = !reducedMotion.matches;
      let speed = 1;
      let time = 0;
      let previous = null;
      let frame = null;

      // Two-segment inverse kinematics keeps each webbed foot on its pedal.
      function leg(side, angle, bob) {
        const front = side === 'front';
        const hip = { x: front ? 535 : 523, y: (front ? 452 : 446) + bob };
        const foot = { x: 558 + Math.cos(angle) * 38, y: 570 + Math.sin(angle) * 38 };
        const dx = foot.x - hip.x;
        const dy = foot.y - hip.y;
        const distance = Math.max(1, Math.hypot(dx, dy));
        const upper = 79;
        const lower = 92;
        const along = (upper * upper - lower * lower + distance * distance) / (2 * distance);
        const height = Math.sqrt(Math.max(0, upper * upper - along * along));
        const knee = {
          x: hip.x + along * dx / distance + height * dy / distance,
          y: hip.y + along * dy / distance - height * dx / distance
        };
        const path = `M${hip.x} ${hip.y}L${knee.x} ${knee.y}L${foot.x} ${foot.y}`;
        parts[`leg-${side}`].setAttribute('d', path);
        parts[`leg-${side}-outline`].setAttribute('d', path);
        parts[`foot-${side}`].setAttribute('transform', `translate(${foot.x} ${foot.y})`);
      }

      function draw() {
        const phase = time * 2.9;
        const bob = Math.sin(phase * 2) * 2;
        const degrees = phase * 180 / Math.PI;
        parts.ride.setAttribute('transform', `translate(0 ${Math.sin(phase * 2) * 1.1})`);
        parts.pelican.setAttribute('transform', `translate(0 ${bob})`);
        parts['rear-spin'].setAttribute('transform', `rotate(${degrees * 1.4})`);
        parts['front-spin'].setAttribute('transform', `rotate(${degrees * 1.4})`);
        parts.crank.setAttribute('transform', `translate(558 570) rotate(${degrees})`);
        leg('front', phase, bob);
        leg('back', phase + Math.PI, bob);
        parts.road.setAttribute('transform', `translate(${-((time * 2.9 * 1.4 * 96) % 1309)} 0)`);
        parts.coast.setAttribute('transform', `translate(${-((time * 25) % 1200)} 0)`);
        parts['cloud-one'].setAttribute('transform', `translate(${-((time * 6) % 1600)} 0)`);
        parts['cloud-two'].setAttribute('transform', `translate(${-((time * 9) % 1600)} 0)`);
        parts['cloud-three'].setAttribute('transform', `translate(${-((time * 4) % 1600)} 0)`);
        parts['scarf-tail'].setAttribute('transform', `rotate(${Math.sin(phase * 2.3) * 3} 566 310)`);
        parts.shadow.setAttribute('rx', 260 + Math.sin(phase * 2) * 3);
        parts.breeze.setAttribute('opacity', .3 + Math.sin(phase) * .12);
        parts.plants.setAttribute('transform', `translate(${-((time * 2.9 * 1.4 * 96) % 1350)} 0)`);
      }

      function tick(now) {
        if (!playing) return;
        if (previous !== null) time += Math.min((now - previous) / 1000, .05) * speed;
        previous = now;
        draw();
        frame = requestAnimationFrame(tick);
      }

      function updateButton() {
        el('toggle-text').textContent = playing ? '暂停骑行' : '继续骑行';
        el('toggle').setAttribute('aria-label', playing ? '暂停骑行' : '继续骑行');
        el('toggle').setAttribute('aria-pressed', String(!playing));
        el('toggle-icon').setAttribute('d', playing ? 'M4 2h3v12H4zM10 2h3v12h-3z' : 'M4 2l10 6-10 6z');
      }

      el('toggle').addEventListener('click', () => {
        playing = !playing;
        previous = null;
        if (playing) frame = requestAnimationFrame(tick);
        else cancelAnimationFrame(frame);
        updateButton();
      });
      el('speed').addEventListener('input', event => {
        speed = Number(event.target.value);
        el('speed-value').value = `${speed.toFixed(1)}×`;
      });
      document.addEventListener('visibilitychange', () => { previous = null; });
      reducedMotion.addEventListener('change', event => {
        if (event.matches) {
          playing = false;
          cancelAnimationFrame(frame);
          previous = null;
          updateButton();
        }
      });
      draw();
      updateButton();
      if (playing) frame = requestAnimationFrame(tick);
    })();
  </script>
</body>
</html>
