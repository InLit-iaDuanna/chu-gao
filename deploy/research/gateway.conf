server {
    listen 8080;
    resolver 127.0.0.11 valid=30s ipv6=off;
    client_max_body_size 3m;
    location /api/research/internal/ {
        set $chugao_backend host.docker.internal:3000;
        proxy_pass http://$chugao_backend;
        proxy_http_version 1.1;
        proxy_set_header Host host.docker.internal;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        access_log off;
    }
    location / { return 404; }
}

server {
    listen 8082;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $backend embedding:8000;
        proxy_pass http://$backend;
        client_max_body_size 8m;
        proxy_read_timeout 180s;
        access_log off;
    }
}

server {
    listen 8083;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $backend gpt-researcher:8000;
        proxy_pass http://$backend;
        client_max_body_size 64m;
        proxy_read_timeout 300s;
        access_log off;
    }
}

server {
    listen 8084;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $backend vane:3000;
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_buffering off;
        client_max_body_size 3m;
        proxy_read_timeout 300s;
        access_log off;
    }
}

server {
    listen 8085;
    resolver 127.0.0.11 valid=5s;
    location / {
        set $backend deerflow:8000;
        proxy_pass http://$backend;
        client_max_body_size 64m;
        proxy_read_timeout 300s;
        access_log off;
    }
}
