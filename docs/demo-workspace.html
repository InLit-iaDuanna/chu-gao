<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chūgǎo — 工作台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ─────────────────────────────────────────────────────────
   令牌系统 — 暖灰 + 橙琥珀强调
   ───────────────────────────────────────────────────────── */
:root[data-theme="dark"] {
  --bg:        #0d0d0f;
  --surface:   #131316;
  --raised:    #1a1a1e;
  --overlay:   #222228;
  --line:      #26262d;
  --line-2:    #34343d;
  --line-3:    #4a4a56;

  --t4:        #f0f0f2;   /* primary text */
  --t3:        #b0b0bc;   /* secondary */
  --t2:        #787884;   /* tertiary */
  --t1:        #4e4e58;   /* disabled / faint */

  --accent:    #e07b3f;   /* 主强调色 */
  --accent-2:  #f0a060;   /* hover */
  --accent-bg: #e07b3f14; /* tint背景 */

  --ok:        #4caf82;
  --warn:      #d4954a;
  --err:       #d95f5f;

  --r1: 4px; --r2: 8px; --r3: 12px; --r4: 16px;
  --sans: "PingFang SC","HarmonyOS Sans SC","Hiragino Sans GB","Microsoft YaHei UI",system-ui,sans-serif;
  --mono: "IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;

  color-scheme: dark;
}

:root[data-theme="light"] {
  --bg:        #f7f7f6;
  --surface:   #ffffff;
  --raised:    #f0f0ef;
  --overlay:   #e8e8e6;
  --line:      #e2e2e0;
  --line-2:    #d0d0cd;
  --line-3:    #b4b4b0;

  --t4:        #111114;
  --t3:        #48484e;
  --t2:        #7a7a80;
  --t1:        #a8a8ae;

  --accent:    #c96030;
  --accent-2:  #e07040;
  --accent-bg: #c9603014;

  --ok:        #2a8a56;
  --warn:      #b07830;
  --err:       #c04040;

  color-scheme: light;
}

/* ─────────────────────────────────────────────────────────
   Reset & base
   ───────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }

body {
  background: var(--bg);
  color: var(--t3);
  font-family: var(--sans);
  font-size: 13px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

/* ─────────────────────────────────────────────────────────
   Layout shell
   ───────────────────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 52px 228px 1fr;
  grid-template-rows: 48px 1fr;
  height: 100dvh;
}

/* ─────────────────────────────────────────────────────────
   Topbar
   ───────────────────────────────────────────────────────── */
.topbar {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.logo {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--t4);
  letter-spacing: -.01em;
  padding: 0 6px;
  margin-right: 4px;
}

.divider { width: 1px; height: 18px; background: var(--line-2); flex: none; }

.session-title {
  font-size: 13px;
  color: var(--t3);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 220px;
}

.spacer { flex: 1; }

/* 小型 pill 标签 — 显示正在生成状态 */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: 99px;
  background: var(--accent-bg);
  border: 1px solid var(--accent)33;
  font-size: 11.5px;
  color: var(--accent-2);
  font-family: var(--mono);
}

.pulse {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent);
  animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.75); }
}

/* Topbar 按钮 */
.t-btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  height: 30px;
  padding: 0 10px;
  border-radius: var(--r2);
  border: 1px solid var(--line-2);
  background: transparent;
  color: var(--t2);
  font: inherit;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
  transition: background .12s, color .12s, border-color .12s;
}
.t-btn:hover { background: var(--raised); color: var(--t4); border-color: var(--line-3); }

.t-btn-primary {
  background: var(--t4);
  color: var(--bg);
  border-color: transparent;
}
.t-btn-primary:hover { opacity: .88; color: var(--bg); background: var(--t4); }

.t-icon {
  width: 30px; height: 30px;
  display: grid; place-items: center;
  border: 0; border-radius: var(--r2);
  background: transparent; color: var(--t2);
  cursor: pointer;
  transition: background .12s, color .12s;
}
.t-icon:hover { background: var(--raised); color: var(--t4); }

.avatar {
  width: 26px; height: 26px; border-radius: 50%;
  background: var(--overlay); color: var(--t3);
  display: grid; place-items: center;
  font-size: 11px; font-weight: 600;
  border: 0; cursor: pointer;
  transition: background .12s, color .12s;
}
.avatar:hover { background: var(--line-2); color: var(--t4); }

/* ─────────────────────────────────────────────────────────
   Rail
   ───────────────────────────────────────────────────────── */
.rail {
  grid-column: 1;
  grid-row: 2;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 0;
  gap: 2px;
}

.r-btn {
  width: 34px; height: 34px;
  border: 0; border-radius: var(--r2);
  background: transparent; color: var(--t1);
  display: grid; place-items: center;
  cursor: pointer;
  position: relative;
  transition: background .12s, color .12s;
}
.r-btn:hover { background: var(--raised); color: var(--t3); }
.r-btn[aria-current] { color: var(--t4); background: var(--overlay); }

/* 激活指示条 */
.r-btn[aria-current]::after {
  content: "";
  position: absolute;
  left: -10px; top: 8px; bottom: 8px;
  width: 2px; border-radius: 0 2px 2px 0;
  background: var(--accent);
}

/* tooltip on hover */
.r-btn[title]:hover::before {
  content: attr(title);
  position: absolute;
  left: calc(100% + 10px);
  top: 50%; transform: translateY(-50%);
  background: var(--overlay);
  border: 1px solid var(--line-2);
  color: var(--t3);
  font-size: 11.5px;
  white-space: nowrap;
  padding: 4px 8px;
  border-radius: var(--r1);
  pointer-events: none;
  z-index: 200;
  font-family: var(--sans);
}

.rail-fill { flex: 1; }

/* ─────────────────────────────────────────────────────────
   Sidebar
   ───────────────────────────────────────────────────────── */
.sidebar {
  grid-column: 2;
  grid-row: 2;
  border-right: 1px solid var(--line);
  background: var(--surface);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.sb-top { padding: 10px 10px 6px; }

.new-session {
  width: 100%;
  display: flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 10px;
  border: 1px solid var(--line-2);
  border-radius: var(--r2);
  background: transparent; color: var(--t2);
  font: inherit; font-size: 12.5px; cursor: pointer;
  transition: all .12s;
}
.new-session:hover {
  background: var(--raised);
  border-color: var(--line-3);
  color: var(--t4);
}

.sb-group {
  padding: 14px 12px 5px;
  font-family: var(--mono);
  font-size: 10px; font-weight: 500;
  letter-spacing: .1em; text-transform: uppercase;
  color: var(--t1);
}

.sb-scroll { flex: 1; overflow-y: auto; padding: 0 6px 12px; min-height: 0; }

/* 每条历史记录 */
.sb-row {
  display: flex; gap: 8px; align-items: flex-start;
  width: 100%;
  padding: 7px 6px;
  border: 0; border-radius: var(--r2);
  background: transparent; text-align: left;
  font: inherit; cursor: pointer;
  transition: background .1s;
  position: relative;
}
.sb-row:hover { background: var(--raised); }
.sb-row[aria-current] {
  background: var(--raised);
}

/* 细线选中状态 */
.sb-row[aria-current]::before {
  content: "";
  position: absolute;
  left: 0; top: 6px; bottom: 6px;
  width: 2px; border-radius: 0 2px 2px 0;
  background: var(--accent);
}

.sb-thumb {
  width: 36px; height: 44px;
  flex: none; border-radius: var(--r1);
  overflow: hidden; background: var(--overlay);
  border: 1px solid var(--line);
}
.sb-thumb canvas { display: block; width: 100%; height: 100%; }

.sb-info { min-width: 0; flex: 1; }
.sb-name {
  font-size: 12.5px; color: var(--t3);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  display: block;
}
.sb-row[aria-current] .sb-name { color: var(--t4); }

.sb-meta {
  display: flex; gap: 4px; align-items: center;
  margin-top: 2px;
  font-family: var(--mono); font-size: 10px; color: var(--t1);
}

/* ─────────────────────────────────────────────────────────
   Main area
   ───────────────────────────────────────────────────────── */
.main {
  grid-column: 3;
  grid-row: 2;
  display: flex; flex-direction: column;
  min-height: 0;
  position: relative;
}

/* ── 生成参数摘要条 ────────────────────────────────────── */
.params-bar {
  flex: none;
  display: flex; align-items: center; gap: 4px;
  padding: 7px 16px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  overflow-x: auto;
  scrollbar-width: none;
}
.params-bar::-webkit-scrollbar { display: none; }

.param-tag {
  display: inline-flex; align-items: center; gap: 5px;
  height: 24px; padding: 0 9px;
  border-radius: var(--r1);
  background: var(--raised);
  border: 1px solid var(--line);
  font-family: var(--mono); font-size: 10.5px;
  white-space: nowrap;
  cursor: default;
}
.param-tag .k { color: var(--t1); }
.param-tag .v { color: var(--t3); font-weight: 500; }

.params-fill { flex: 1; }

.prompt-preview {
  font-size: 12px; color: var(--t2);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  max-width: 360px;
}
.prompt-preview em { font-style: normal; color: var(--t3); }

/* ── 画廊 ───────────────────────────────────────────────── */
.gallery {
  flex: 1; overflow-y: auto; min-height: 0;
  padding: 20px 16px 180px;
}

/* ── 轮次分隔 ───────────────────────────────────────────── */
.round-sep {
  display: flex; align-items: center; gap: 10px;
  margin: 24px 0 14px;
}
.round-sep:first-child { margin-top: 0; }

.round-label {
  font-family: var(--mono); font-size: 10.5px;
  color: var(--t1); white-space: nowrap;
  font-weight: 500;
}
.round-line { flex: 1; height: 1px; background: var(--line); }
.round-time { font-family: var(--mono); font-size: 10px; color: var(--t1); }

/* ── 图版网格 ───────────────────────────────────────────── */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
}

/* ── 单张卡片 ───────────────────────────────────────────── */
.card {
  position: relative;
  border-radius: var(--r3);
  border: 1px solid var(--line);
  overflow: hidden;
  background: var(--raised);
  cursor: zoom-in;
  transition: border-color .16s, box-shadow .16s, transform .16s;
}
.card:hover {
  border-color: var(--line-3);
  box-shadow: 0 8px 28px -8px #00000080;
  transform: translateY(-1px);
}
.card[aria-pressed="true"] {
  border-color: var(--accent)80;
  box-shadow: 0 0 0 1px var(--accent)40, 0 8px 28px -8px #00000080;
}

/* 图面 */
.card-img {
  display: block; width: 100%; aspect-ratio: 4/5;
}
.card-img canvas { display: block; width: 100%; height: 100%; }

/* 图面上的角标 */
.card-badge {
  position: absolute; top: 8px; left: 8px; z-index: 3;
  font-family: var(--mono); font-size: 10px;
  padding: 2px 6px; border-radius: var(--r1);
  background: #0000009a; color: #ffffff99;
  backdrop-filter: blur(6px);
  pointer-events: none;
}

/* 暗角 */
.card-vig {
  position: absolute; inset: 0; z-index: 2;
  background: radial-gradient(110% 90% at 50% 38%, transparent 40%, #00000055 100%);
  pointer-events: none;
}

/* 悬停操作 */
.card-acts {
  position: absolute; inset: auto 0 0 0; z-index: 4;
  display: flex; justify-content: flex-end; gap: 4px;
  padding: 24px 8px 8px;
  background: linear-gradient(to top, #000000c8 0%, transparent 100%);
  opacity: 0; transform: translateY(4px);
  transition: opacity .15s, transform .15s;
}
.card:hover .card-acts,
.card:focus-within .card-acts { opacity: 1; transform: none; }

.act-btn {
  width: 30px; height: 30px;
  border: 0; border-radius: var(--r2);
  background: #ffffff14; color: #ffffffcc;
  display: grid; place-items: center;
  cursor: pointer; backdrop-filter: blur(8px);
  transition: background .12s, transform .1s;
}
.act-btn:hover { background: #ffffff2a; transform: scale(1.05); }
.act-btn:active { transform: scale(.96); }

/* 图注 */
.card-foot {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px 9px;
  border-top: 1px solid var(--line);
}
.card-foot .num {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500;
  color: var(--t2);
  transition: color .15s;
}
.card[aria-pressed="true"] .card-foot .num { color: var(--accent-2); }

.card-foot .dim {
  font-family: var(--mono); font-size: 10px; color: var(--t1);
}
.card-foot-fill { flex: 1; }
.card-foot .seed {
  font-family: var(--mono); font-size: 10px; color: var(--t1);
  font-variant-numeric: tabular-nums;
}

/* ── 生成中卡片 ─────────────────────────────────────────── */
.card-pending {
  border-style: dashed; cursor: default;
}
.card-pending:hover {
  border-color: var(--line); transform: none;
  box-shadow: none;
}

.pending-inner {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  aspect-ratio: 4/5;
  gap: 10px;
  background: var(--raised);
}

/* 环形进度 — 用 SVG 动画 */
.ring-wrap { position: relative; width: 28px; height: 28px; }
.ring-track {
  fill: none; stroke: var(--line-2); stroke-width: 2.5;
}
.ring-prog {
  fill: none; stroke: var(--accent); stroke-width: 2.5;
  stroke-linecap: round;
  stroke-dasharray: 66 66;
  transform-origin: 14px 14px;
  animation: ring-spin 1.1s linear infinite;
}
@keyframes ring-spin {
  to { transform: rotate(360deg); }
}

.pending-txt {
  font-family: var(--mono); font-size: 10.5px; color: var(--t2);
  letter-spacing: .03em; text-align: center;
}
.pending-elapsed {
  font-family: var(--mono); font-size: 10px; color: var(--t1);
  font-variant-numeric: tabular-nums;
}

/* 进度扫光线 */
.card-progress {
  position: absolute; bottom: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), transparent);
  background-size: 240% 100%;
  animation: sweep 2s linear infinite;
}
@keyframes sweep {
  0% { background-position: 240% 0; }
  100% { background-position: -240% 0; }
}

/* ── 历史缩略条 ─────────────────────────────────────────── */
.history-strip {
  display: flex; gap: 6px; flex-wrap: wrap;
  margin-top: 14px;
}

.h-card {
  width: 40px; height: 50px;
  border-radius: var(--r1);
  border: 1px solid var(--line);
  overflow: hidden; padding: 0;
  cursor: pointer; background: var(--raised);
  transition: border-color .12s, transform .12s, box-shadow .12s;
}
.h-card:hover {
  border-color: var(--line-3);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px -4px #00000060;
}
.h-card canvas { display: block; width: 100%; height: 100%; }

/* ─────────────────────────────────────────────────────────
   Dock — 输入区
   ───────────────────────────────────────────────────────── */
.dock {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 50;
  padding: 0 16px 16px;
  background: linear-gradient(to top, var(--bg) 60%, transparent 100%);
}

.dock-shell {
  border: 1px solid var(--line-2);
  border-radius: var(--r3);
  background: var(--surface);
  overflow: hidden;
  box-shadow: 0 2px 16px -4px #00000060, 0 0 0 1px var(--line);
  transition: border-color .15s, box-shadow .15s;
}
.dock-shell:focus-within {
  border-color: var(--line-3);
  box-shadow: 0 4px 24px -4px #00000080, 0 0 0 1px var(--line-3);
}

/* 工具栏 */
.dock-tools {
  display: flex; align-items: center; gap: 2px;
  padding: 6px 6px 0;
}

.d-tool {
  width: 30px; height: 30px;
  border: 0; border-radius: var(--r2);
  background: transparent; color: var(--t1);
  display: grid; place-items: center;
  cursor: pointer;
  position: relative;
  transition: background .12s, color .12s;
}
.d-tool:hover { background: var(--raised); color: var(--t3); }

/* 工具 tooltip */
.d-tool:hover::after {
  content: attr(title);
  position: absolute; bottom: calc(100% + 6px); left: 50%;
  transform: translateX(-50%);
  background: var(--overlay);
  border: 1px solid var(--line-2);
  color: var(--t3); font-size: 11px;
  white-space: nowrap; padding: 3px 7px;
  border-radius: var(--r1); pointer-events: none;
  font-family: var(--sans);
}

.d-tool-badge {
  position: absolute; top: 4px; right: 4px;
  width: 5px; height: 5px; border-radius: 50%;
  background: var(--accent); border: 1px solid var(--surface);
  pointer-events: none;
}

.dock-tools-sep { flex: 1; }

.dock-model {
  display: flex; align-items: center; gap: 5px;
  height: 26px; padding: 0 8px;
  border-radius: var(--r1);
  border: 1px solid var(--line);
  background: transparent; color: var(--t2);
  font: inherit; font-family: var(--mono); font-size: 11px;
  cursor: pointer;
  transition: background .12s, border-color .12s, color .12s;
}
.dock-model:hover { background: var(--raised); border-color: var(--line-2); color: var(--t3); }
.dock-model .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ok); flex: none; }

/* 输入框 */
label[for="p"] { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

.dock-textarea {
  display: block; width: 100%;
  background: transparent; border: 0; resize: none; outline: none;
  color: var(--t4); font: inherit; font-size: 14px; line-height: 1.7;
  padding: 10px 14px 8px;
  max-height: 160px;
}
.dock-textarea::placeholder { color: var(--t1); }

/* 底部行 */
.dock-bottom {
  display: flex; align-items: center; gap: 6px;
  padding: 6px 10px 10px;
}

.d-chip {
  display: inline-flex; align-items: center; gap: 4px;
  height: 24px; padding: 0 8px;
  border: 1px solid var(--line); border-radius: var(--r1);
  background: transparent; cursor: pointer;
  font: inherit; font-family: var(--mono); font-size: 10.5px;
  transition: background .12s, border-color .12s;
}
.d-chip:hover { background: var(--raised); border-color: var(--line-2); }
.d-chip .k { color: var(--t1); }
.d-chip .v { color: var(--t2); font-weight: 500; }
.d-chip:hover .v { color: var(--t3); }

.dock-fill { flex: 1; }

.d-cost {
  font-family: var(--mono); font-size: 10.5px; color: var(--t1);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}

.d-send {
  display: inline-flex; align-items: center; gap: 6px;
  height: 34px; padding: 0 16px;
  border: 0; border-radius: var(--r2);
  background: var(--t4); color: var(--bg);
  font: inherit; font-size: 13px; font-weight: 500;
  cursor: pointer; white-space: nowrap; flex: none;
  transition: opacity .12s, transform .1s;
}
.d-send:hover { opacity: .9; }
.d-send:active { transform: scale(.97); opacity: 1; }

/* ─────────────────────────────────────────────────────────
   Scrollbar
   ───────────────────────────────────────────────────────── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb {
  background: var(--line-2); border-radius: 99px;
  border: 2px solid var(--bg);
}
::-webkit-scrollbar-thumb:hover { background: var(--line-3); }

/* ─────────────────────────────────────────────────────────
   Accessibility
   ───────────────────────────────────────────────────────── */
:focus-visible {
  outline: 1.5px solid var(--accent); outline-offset: 2px; border-radius: var(--r1);
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

/* ─────────────────────────────────────────────────────────
   Responsive
   ───────────────────────────────────────────────────────── */
@media (max-width: 920px) {
  .app { grid-template-columns: 52px 1fr; }
  .sidebar { display: none; }
}

<script>
/* 用 canvas 2D 画出接近摄影风格的占位图 ─────────────────── */
function paintScene(id, cfg) {
  const c = document.getElementById(id);
  if (!c) return;
  const ctx = c.getContext('2d');
  const w = c.width, h = c.height;

  // 天空渐变
  const sky = ctx.createLinearGradient(0, 0, 0, h);
  cfg.sky.forEach(([s, col]) => sky.addColorStop(s, col));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, w, h);

  // 远山（模糊层次感，用多层半透明填充模拟）
  cfg.mountains && cfg.mountains.forEach(m => {
    ctx.fillStyle = m.color;
    ctx.globalAlpha = m.alpha ?? 1;
    ctx.beginPath();
    ctx.moveTo(0, h);
    m.pts.forEach(([px, py]) => ctx.lineTo(px * w, py * h));
    ctx.lineTo(w, h);
    ctx.closePath();
    ctx.fill();
    ctx.globalAlpha = 1;
  });

  // 雾气层
  if (cfg.fog) {
    const fg = ctx.createRadialGradient(
      cfg.fog.cx * w, cfg.fog.cy * h, 0,
      cfg.fog.cx * w, cfg.fog.cy * h, cfg.fog.r * w
    );
    fg.addColorStop(0, cfg.fog.col + '44');
    fg.addColorStop(1, cfg.fog.col + '00');
    ctx.fillStyle = fg;
    ctx.fillRect(0, 0, w, h);
  }

  // 建筑剪影
  if (cfg.building) {
    const b = cfg.building;
    ctx.fillStyle = b.color;
    ctx.globalAlpha = b.alpha ?? 1;
    ctx.fillRect(b.x * w, b.y * h, b.bw * w, b.bh * h);
    ctx.globalAlpha = 1;
  }

  // 窗光晕
  if (cfg.glow) {
    const g = cfg.glow;
    const grd = ctx.createRadialGradient(
      g.x * w, g.y * h, 0,
      g.x * w, g.y * h, g.r * Math.min(w, h)
    );
    grd.addColorStop(0, g.col + 'ee');
    grd.addColorStop(.3, g.col + '88');
    grd.addColorStop(1, g.col + '00');
    ctx.fillStyle = grd;
    ctx.fillRect(0, 0, w, h);

    // 窗口
    ctx.fillStyle = g.col + 'cc';
    ctx.fillRect(
      (g.x - .06) * w, (g.y - .04) * h,
      .12 * w, .08 * h
    );
  }

  // 颗粒噪点
  const id2 = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < id2.data.length; i += 4) {
    const n = (Math.random() - .5) * 22;
    id2.data[i]   = Math.max(0, Math.min(255, id2.data[i]   + n));
    id2.data[i+1] = Math.max(0, Math.min(255, id2.data[i+1] + n));
    id2.data[i+2] = Math.max(0, Math.min(255, id2.data[i+2] + n));
  }
  ctx.putImageData(id2, 0, 0);
}

    glow:{x:.5,y:.72,r:.28,col:'#6090c0'} },
  { sky:[[0,'#1a1620'],[.4,'#28223a'],[.7,'#3a3058'],[1,'#2c2440']],
    glow:{x:.5,y:.7,r:.3,col:'#8060b0'} },

    glow:{x:.5,y:.68,r:.28,col:'#a08840'} },
];

['t0','t1','t2','t3','t4','t5'].forEach((id, i) => {
  paintScene(id, thumbScenes[i] || scene1);
});
['h0','h1','h2','h3','h4'].forEach((id, i) => {
  const variants = [scene2, scene1, scene2, scene1, scene2];
  paintScene(id, variants[i] || scene1);
});

// 计时器
let t = 12.6;
setInterval(() => {
  t += .1;
  const el = document.querySelector('.pending-elapsed');
  if (el) el.textContent = t.toFixed(1) + ' s';
}, 100);
