  <path d="M194 190H302M194 232H274" stroke="#73C69E" stroke-width="18" stroke-linecap="round"/>
  <path d="M194 274H302" stroke="#F4F7F5" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

